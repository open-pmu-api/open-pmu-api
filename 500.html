<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur 500 – Erreur interne du serveur</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1a202c, #2d3748);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    .container {
      max-width: 520px;
      width: 100%;
    }

    .error-code {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      color: #fc8181;
      text-shadow: 0 4px 20px rgba(252, 129, 129, 0.3);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #fff;
    }

    p {
      font-size: 1.1rem;
      color: #a0aec0;
      margin-bottom: 2.2rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      background-color: #4299e1;
      color: white;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      transition: background-color 0.2s, transform 0.15s;
    }

    .btn:hover {
      background-color: #3182ce;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .small {
      margin-top: 2.5rem;
      font-size: 0.9rem;
      color: #718096;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .error-code {
        font-size: 5rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">500</div>
    <h1>Erreur interne du serveur</h1>
    <p>
      Désolé, quelque chose s’est mal passé de notre côté.<br>
      Nos équipes ont été informées et travaillent à résoudre le problème.
    </p>
    <a href="/" class="btn">Retour à l’accueil</a>
    <p class="small">Si le problème persiste, n’hésitez pas à nous contacter.</p>
  </div>
</body>
</html>
